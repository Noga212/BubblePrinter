<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BubblePrinter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="app">
    <div class="ui-layer">
      <div class="header panel">
        <h1>Bubble<span class="brand-accent">Printer</span></h1>
        <select id="demoModelSelector" class="value-input" style="margin-right: 10px; width: 180px;">
          <option value="" disabled selected>Load Demo Model</option>
          <option value="./models/cube_simple.obj">Cube</option>
          <option value="./models/sphere_smooth.obj">Sphere</option>
          <option value="./models/cylinder.obj">Cylinder</option>
          <option value="./models/cone_smooth.obj">Cone</option>
          <option value="./models/pyramid.obj">Pyramid</option>
          <option value="./models/octahedron.obj">Octahedron</option>
          <option value="./models/tetrahedron.obj">Tetrahedron</option>
          <option value="./models/torus_complex.obj">Torus</option>
        </select>
        <button class="upload-btn" id="uploadBtn">Load OBJ File</button>
        <input type="file" id="fileInput" accept=".obj" style="display: none;">
      </div>

      <div class="slice-preview-panel panel">
        <h3>2D Slice Preview</h3>
        <canvas id="sliceCanvas" width="300" height="300"></canvas>
      </div>

      <!-- Layer Settings Panel -->
      <div class="layer-panel panel">
        <div class="panel-header">
          <h3>Layer Settings</h3>
        </div>
        <div class="layer-settings-content">
          <div class="setting-row" title="Total number of layers to slice the model into.">
            <label>Layer Count:</label>
            <div style="display: flex; align-items: center; gap: 5px;">
              <input type="number" id="layerCountInput" min="1" step="1" value="200" class="value-input" style="width: 70px;">
              <span style="display: inline-block; width: 18px;"></span>
            </div>
          </div>
          <div class="setting-row" title="The height of each individual layer in millimeters.">
            <label>Layer Height:</label>
            <div style="display: flex; align-items: center; gap: 5px;">
              <input type="number" id="layerHeightInput" min="0.01" step="0.01" value="0.15" class="value-input" style="width: 70px;">
              <span style="color: var(--text-muted); font-size: 0.8rem; display: inline-block; width: 18px;">mm</span>
            </div>
          </div>
        </div>
      </div>

      <div class="slider-container">
        <div id="sliceCounter" class="slice-counter">Slice 200/200</div>
        <div class="slider-wrapper">
          <input type="range" id="sliceSlider" min="0" max="200" value="200">
        </div>
      </div>

      <!-- Bubble Mode Panel -->
      <div class="bubble-panel panel">
        <div class="panel-header">
          <h3>Bubble Mode</h3>
          <label class="switch">
            <input type="checkbox" id="bubbleModeToggle">
            <span class="slider round"></span>
          </label>
        </div>

        <div id="bubbleSettings" class="bubble-settings" style="display: none;">
          <div class="setting-row" title="The packing pattern used to arrange bubbles on each layer.">
            <label>Arrangement:</label>
            <select id="bubbleArrangement" class="value-input" style="width: 100px;">
              <option value="grid">Grid</option>
              <option value="oranges">Oranges</option>
              <option value="rejection">Random</option>
            </select>
          </div>
          <div class="setting-row" title="The diameter of individual bubbles in millimeters.">
            <label>Size:</label>
            <input type="number" id="bubbleSizeInput" min="0.01" max="2.0" step="0.01" value="0.5" class="value-input">
            <span>mm</span>
          </div>
          <input type="range" id="bubbleSizeSlider" min="0.01" max="2.0" step="0.01" value="0.5"
            class="horizontal-slider" title="The diameter of individual bubbles in millimeters.">
          <div class="setting-row" title="How much bubbles intersect with the layer beneath them. Higher values squish layers together.">
            <label>Vertical Overlap:</label>
            <input type="number" id="bubbleOverlapVInput" min="0" max="70" step="1" value="0" class="value-input">
            <span>%</span>
          </div>
          <input type="range" id="bubbleOverlapVSlider" min="0" max="70" step="1" value="0" class="horizontal-slider" title="How much bubbles intersect with the layer beneath them. Higher values squish layers together.">

          <div class="setting-row" title="How much bubbles intersect with neighbor bubbles on the same layer.">
            <label>Horizontal Overlap:</label>
            <input type="number" id="bubbleOverlapHInput" min="0" max="70" step="1" value="0" class="value-input">
            <span>%</span>
          </div>
          <input type="range" id="bubbleOverlapHSlider" min="0" max="70" step="1" value="0" class="horizontal-slider" title="How much bubbles intersect with neighbor bubbles on the same layer.">
          <div class="setting-row" title="Flattens the bottom-most layer of bubbles to improve bed adhesion.">
            <label>Base Flatten:</label>
            <input type="number" id="baseFlattenInput" min="0" max="100" step="1" value="50" class="value-input">
            <span>%</span>
          </div>
          <input type="range" id="baseFlattenSlider" min="0" max="100" step="1" value="50" class="horizontal-slider" title="Flattens the bottom-most layer of bubbles to improve bed adhesion.">
        </div>
      </div>

      <!-- Layer Settings Modal -->
    </div>
  </div>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js?v=25"></script>
</body>

</html>
